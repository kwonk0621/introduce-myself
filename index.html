<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="멋지고 심플한 자기소개 페이지입니다. 저를 소개합니다.">
    <title>자기소개 | Hello World!</title>
    
    <!-- Google Fonts Load -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 공통 레이아웃: 헤더 -->
    <header class="main-header" id="mainHeader">
        <div class="header-container">
            <a href="#" class="logo" id="logo">Kwon.dev</a>
            <nav class="nav-menu" id="navMenu">
                <a href="#about" class="nav-link active">About</a>
                <a href="#projects" class="nav-link">Projects</a>
                <a href="#contact" class="nav-link">Contact</a>
            </nav>
        </div>
    </header>

    <!-- 공통 레이아웃: 메인 컨텐츠 영역 -->
    <main class="main-content" id="mainContent">
        <section class="section-container" id="about">
            <article class="profile-card" id="profileCard">
                <div class="profile-image-container">
                    <img src="profile.jpg" alt="프로필 이미지" class="profile-img" id="profileImage">
                </div>
                
                <h1 class="name" id="profileName">김개발 (Developer Kim)</h1>
                <p class="title" id="profileTitle">Frontend Developer</p>
                
                <p class="greeting" id="profileGreeting">
                    안녕하세요! 새로운 가치를 창출하는 것을 좋아하는 프론트엔드 개발자 김개발입니다. 
                    사람들과 소통하며 더 나은 사용자 경험을 만드는 웹 기술에 관심이 많습니다. 
                    오늘도 한 걸음 더 성장하기 위해 노력하고 있습니다.
                </p>
                
                <a href="mailto:contact@example.com" class="btn-contact" id="contactButton">Contact Me</a>
            </article>
        </section>
    </main>

    <!-- 공통 레이아웃: 푸터 -->
    <footer class="main-footer" id="mainFooter">
        <div class="footer-container">
            <p class="copyright">&copy; 2026 Kwon. All rights reserved.</p>
            <div class="footer-links">
                <a href="#" class="footer-link">GitHub</a>
                <a href="#" class="footer-link">LinkedIn</a>
            </div>
        </div>
    </footer>
</body>
</html>
